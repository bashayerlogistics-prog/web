# Auto-deploy frontend to Hostinger on every push to main.
# Required GitHub Secrets are listed in hostinger/GITHUB-DEPLOY.md

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPERADMIN_EMAIL: ${{ secrets.VITE_SUPERADMIN_EMAIL }}
          VITE_SUPERADMIN_UID: ${{ secrets.VITE_SUPERADMIN_UID }}
          VITE_IMGBB_API_KEY: ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_RESEND_WEBHOOK_URL: ${{ secrets.VITE_RESEND_WEBHOOK_URL }}
          VITE_EMAIL_WEBHOOK_SECRET: ${{ secrets.VITE_EMAIL_WEBHOOK_SECRET }}
          VITE_RESEND_FROM_EMAIL: ${{ secrets.VITE_RESEND_FROM_EMAIL }}
          VITE_MOYASAR_PUBLISHABLE_KEY: ${{ secrets.VITE_MOYASAR_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Prepare Hostinger package
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.VITE_EMAIL_WEBHOOK_SECRET }}
        run: |
          cp hostinger/resend-send.php dist/resend-send.php
          cp hostinger/.htaccess dist/.htaccess
          if [ -n "$RESEND_API_KEY" ]; then
            sed -i "s|__RESEND_API_KEY__|${RESEND_API_KEY}|g" dist/resend-send.php
          fi
          if [ -n "$WEBHOOK_SECRET" ]; then
            sed -i "s|__WEBHOOK_SECRET__|${WEBHOOK_SECRET}|g" dist/resend-send.php
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          # Use an FTP account rooted at this domain's live public_html directory.
          server-dir: ./
          protocol: ftps
          dangerous-clean-slate: false
