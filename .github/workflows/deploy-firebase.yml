# Auto-deploy Firestore rules + Cloud Functions on push to main.
# Optional: skip if FIREBASE_TOKEN secret is not set (workflow will fail until you add it).

name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Deploy rules + functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret. Create with: npx firebase login:ci"
            exit 1
          fi
          # Storage only if enabled in Firebase console (Get Started).
          # Until then deploy rules + indexes + functions.
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,functions --non-interactive --token "$FIREBASE_TOKEN"
