# Auto-deploy Firestore rules + Cloud Functions on push to main.
# Optional: skip if FIREBASE_TOKEN secret is not set (workflow will fail until you add it).

name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firestore rules + indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret."
            exit 1
          fi
          # Cloud Functions need Blaze billing — this project uses Hostinger/Resend instead.
          # Deploy only Firestore rules + indexes on free Spark plan.
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes --non-interactive --token "$FIREBASE_TOKEN"
